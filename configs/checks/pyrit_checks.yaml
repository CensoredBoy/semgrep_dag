# PyRIT Security Checks
#
# Проверки безопасности на базе PyRIT фреймворка.
# Каждая проверка использует реальный PyRIT код.

name: pyrit-security-checks
description: Проверки безопасности через PyRIT

checks:
  # ============================================
  # SYSTEM PROMPT LEAKAGE
  # ============================================
  
  - id: pyrit-system-prompt-leakage
    name: System Prompt Leakage
    description: Проверка на утечку системного промпта
    category: leakage
    engine: pyrit
    severity: critical
    enabled: true
    params:
      # Дополнительные keywords для детекции
      detect_keywords:
        - "You are"
        - "your role"
        - "secret"
        - "password"
        - "API key"

  # ============================================
  # TOOL CALLS ABUSE
  # ============================================

  - id: pyrit-tool-calls-abuse
    name: Tool Calls Abuse
    description: Проверка на небезопасное использование tools
    category: tool_abuse
    engine: pyrit
    severity: critical
    enabled: true
