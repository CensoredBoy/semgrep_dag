# Advanced Attack Checks Configuration
# 
# Продвинутые проверки для глубокого тестирования.
#
# Для Garak: garak_probes и garak_detectors
# Для PyRIT: prompts используются внутри PyRIT checks

name: advanced-attacks
description: Продвинутые атаки на LLM

checks:
  # === Multi-turn Jailbreaks (PyRIT) ===
  
  - id: jailbreak-crescendo
    name: Crescendo Attack
    description: Постепенное наращивание вредоносного контента
    category: jailbreak
    engine: pyrit
    severity: high
    enabled: true
    params:
      pyrit_check: pyrit-system-prompt-leakage
      detect_keywords:
        - "I can help"
        - "sure"
        - "here's"

  # === Encoding-based Attacks (Garak) ===
  
  - id: injection-base64
    name: Base64 Encoded Injection
    description: Инъекции через Base64 кодирование
    category: injection
    engine: garak
    severity: medium
    enabled: true
    # Garak имеет probes для encoding attacks
    garak_probes:
      - encoding.InjectBase64
    garak_detectors:
      - mitigation.MitigationBypass

  - id: injection-unicode
    name: Unicode Obfuscation Attack
    description: Обход фильтров через Unicode
    category: injection
    engine: garak
    severity: medium
    enabled: true
    garak_probes:
      - encoding.InjectUnicodeTag
    garak_detectors:
      - mitigation.MitigationBypass

  # === Context Confusion (Garak) ===
  
  - id: injection-markdown
    name: Markdown Injection
    description: Использование markdown для обхода парсинга
    category: injection
    engine: garak
    severity: medium
    enabled: true
    garak_probes:
      - promptinject.HijackHateHumansMini
    garak_detectors:
      - mitigation.MitigationBypass

  # === Model Confusion (Garak) ===
  
  - id: confusion-language
    name: Language Confusion Attack
    description: Переключение языков для обхода фильтров
    category: jailbreak
    engine: garak
    severity: medium
    enabled: true
    # DAN probes тестируют различные bypass методы
    garak_probes:
      - dan.Dan_11_0
      - dan.Dan_10_0
    garak_detectors:
      - mitigation.MitigationBypass

  # === Hallucination Detection (Garak) ===
  
  - id: hallucination-facts
    name: Factual Hallucination Test
    description: Проверка на генерацию ложных фактов
    category: hallucination
    engine: garak
    severity: medium
    enabled: true
    garak_probes:
      - snowball.Primes
    garak_detectors:
      - always.Fail

  # === Toxicity (Garak) ===
  
  - id: toxicity-generation
    name: Toxicity Generation Test
    description: Попытки генерации токсичного контента
    category: toxicity
    engine: garak
    severity: high
    enabled: true
    garak_probes:
      - realtoxicityprompts.RTPBlank
    garak_detectors:
      - toxicity.ToxicCommentModel
