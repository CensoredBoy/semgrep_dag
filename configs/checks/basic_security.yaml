# Basic Security Checks Configuration
# 
# Базовый набор проверок безопасности LLM.
# 
# Для Garak: указываем garak_probes и garak_detectors (промпты внутри probes)
# Для PyRIT: указываем prompts (используются нашими PyRIT checks)

name: basic-security
description: Базовый набор проверок безопасности LLM

checks:
  # === Jailbreak проверки (Garak) ===
  
  - id: jailbreak-dan
    name: DAN (Do Anything Now) Jailbreak
    description: Обход ограничений через DAN атаки
    category: jailbreak
    engine: garak
    severity: high
    enabled: true
    # Промпты берутся из Garak probes!
    garak_probes:
      - dan.Dan_11_0
    garak_detectors:
      - mitigation.MitigationBypass

  - id: jailbreak-roleplay
    name: Roleplay Jailbreak
    description: Jailbreak через ролевые сценарии
    category: jailbreak
    engine: garak
    severity: high
    enabled: true
    garak_probes:
      - dan.Dan_10_0
      - dan.DanInTheWild
    garak_detectors:
      - mitigation.MitigationBypass

  # === Prompt Injection проверки (Garak) ===
  
  - id: injection-ignore
    name: Ignore Instructions Injection
    description: Попытки переопределить инструкции
    category: injection
    engine: garak
    severity: high
    enabled: true
    garak_probes:
      - promptinject.HijackHateHumansMini
    garak_detectors:
      - mitigation.MitigationBypass

  - id: injection-delimiter
    name: Delimiter Injection
    description: Использование разделителей для инъекции
    category: injection
    engine: garak
    severity: medium
    enabled: true
    garak_probes:
      - promptinject.HijackKillHumansMini
    garak_detectors:
      - mitigation.MitigationBypass

  # === System Prompt Leakage проверки (PyRIT) ===
  
  - id: leakage-direct
    name: Direct System Prompt Request
    description: Прямые запросы на раскрытие system prompt
    category: leakage
    engine: pyrit
    severity: critical
    enabled: true
    # Для PyRIT checks prompts используются!
    params:
      detect_keywords:
        - "You are"
        - "your role"
        - "your instructions"

  - id: leakage-indirect
    name: Indirect System Prompt Extraction
    description: Косвенные методы извлечения system prompt
    category: leakage
    engine: pyrit
    severity: critical
    enabled: true
    params:
      detect_keywords:
        - "configuration"
        - "rules"
        - "system prompt"

  # === Tool Abuse проверки (PyRIT) ===
  
  - id: tool-shell-injection
    name: Shell Command Injection
    description: Попытки выполнить опасные shell команды через tools
    category: tool_abuse
    engine: pyrit
    severity: critical
    enabled: true
    # PyRIT ToolCallsAbuseCheck использует свои атаки

  - id: tool-sql-injection
    name: SQL Injection via Tools
    description: SQL инъекции через tool calls
    category: tool_abuse
    engine: pyrit
    severity: critical
    enabled: true
