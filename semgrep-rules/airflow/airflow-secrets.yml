rules:
  - id: airflow-hardcoded-password-variable
    message: "ОПАСНО: Хардкоженный пароль в переменной. Используйте Secret Backend или переменные окружения."
    languages:
      - python
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: $VAR = "..."
          - pattern: $VAR = '...'
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i).*(password|passwd|pwd|secret|token|key|credential|auth).*
      - metavariable-regex:
          metavariable: $VAR
          regex: .{8,}
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 – Identification and Authentication Failures"

  - id: airflow-hardcoded-api-key
    message: "ОПАСНО: Хардкоженный API ключ. Используйте Secret Backend или переменные окружения."
    languages:
      - python
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: $VAR = "..."
          - pattern: $VAR = '...'
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i).*(api[_-]?key|apikey|access[_-]?key|secret[_-]?key|aws[_-]?access[_-]?key|aws[_-]?secret).*
      - metavariable-regex:
          metavariable: $VAR
          regex: .{10,}
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 – Identification and Authentication Failures"

  - id: airflow-connection-password-hardcoded
    message: "ОПАСНО: Пароль указан напрямую в Connection. Используйте Secret Backend."
    languages:
      - python
    severity: ERROR
    patterns:
      - pattern: |
          Connection(..., password="...", ...)
      - pattern: |
          Connection(..., password='...', ...)
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 – Identification and Authentication Failures"

  - id: airflow-connection-extra-private-key
    message: "ОПАСНО: Приватный ключ указан в extra Connection. Используйте Secret Backend."
    languages:
      - python
    severity: ERROR
    patterns:
      - pattern: |
          Connection(..., extra={..., "private_key": "...", ...}, ...)
      - pattern: |
          Connection(..., extra={..., 'private_key': '...', ...}, ...)
      - pattern: |
          Connection(..., extra={..., "private_key": '...', ...}, ...)
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 – Identification and Authentication Failures"

  - id: airflow-jwt-token-hardcoded
    message: "ОПАСНО: JWT токен хардкожен в коде. Используйте Secret Backend."
    languages:
      - python
    severity: ERROR
    patterns:
      - pattern: $VAR = $TOKEN
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i).*(jwt|token).*
      - metavariable-regex:
          metavariable: $TOKEN
          regex: ^eyJ
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 – Identification and Authentication Failures"

