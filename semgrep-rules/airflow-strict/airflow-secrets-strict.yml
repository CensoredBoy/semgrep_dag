rules:
  # УСИЛЕННОЕ ПРАВИЛО: Секреты в комментариях
  - id: airflow-secrets-in-comments
    message: "ОПАСНО: Обнаружен возможный секрет в комментарии. Удалите секреты из кода."
    languages:
      - python
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: |
              # ...$SECRET...
          - pattern: |
              """...$SECRET..."""
          - pattern: |
              '''...$SECRET...'''
      - metavariable-regex:
          metavariable: $SECRET
          regex: (?i)(password|passwd|pwd|secret|token|key|credential|auth|api[_-]?key|access[_-]?key|aws[_-]?access[_-]?key|aws[_-]?secret|private[_-]?key|jwt|bearer).*=.*['"][^'"]{8,}['"]
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 – Identification and Authentication Failures"

  # УСИЛЕННОЕ ПРАВИЛО: Variable.set() с хардкоженными секретами
  - id: airflow-variable-set-secret
    message: "ОПАСНО: Variable.set() используется с хардкоженным секретом. Используйте Secret Backend."
    languages:
      - python
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: |
              Variable.set(..., "...")
          - pattern: |
              Variable.set(..., '...')
      - metavariable-regex:
          metavariable: $VAR
          regex: .{10,}
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 – Identification and Authentication Failures"

  # УСИЛЕННОЕ ПРАВИЛО: Секреты в строковых литералах функций
  - id: airflow-secrets-in-function-calls
    message: "ОПАСНО: Секрет передается как строковый литерал в функцию. Используйте Secret Backend."
    languages:
      - python
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: |
              $FUNC(..., password="...", ...)
          - pattern: |
              $FUNC(..., password='...', ...)
          - pattern: |
              $FUNC(..., api_key="...", ...)
          - pattern: |
              $FUNC(..., api_key='...', ...)
          - pattern: |
              $FUNC(..., token="...", ...)
          - pattern: |
              $FUNC(..., token='...', ...)
          - pattern: |
              $FUNC(..., secret="...", ...)
          - pattern: |
              $FUNC(..., secret='...', ...)
      - metavariable-regex:
          metavariable: $VAR
          regex: .{8,}
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 – Identification and Authentication Failures"

