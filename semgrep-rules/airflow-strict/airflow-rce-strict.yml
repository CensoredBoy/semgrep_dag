rules:
  # УСИЛЕННОЕ ПРАВИЛО: Запрет eval() везде в DAG файлах
  - id: airflow-eval-anywhere
    message: "КРИТИЧНО: Использование eval() запрещено в DAG файлах. Это может привести к Remote Code Execution."
    languages:
      - python
    severity: ERROR
    patterns:
      - pattern: eval(...)
    metadata:
      category: security
      cwe: "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code"
      owasp: "A03:2021 – Injection"

  # УСИЛЕННОЕ ПРАВИЛО: Запрет exec() везде в DAG файлах
  - id: airflow-exec-anywhere
    message: "КРИТИЧНО: Использование exec() запрещено в DAG файлах. Это может привести к Remote Code Execution."
    languages:
      - python
    severity: ERROR
    patterns:
      - pattern: exec(...)
    metadata:
      category: security
      cwe: "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code"
      owasp: "A03:2021 – Injection"

  # УСИЛЕННОЕ ПРАВИЛО: Запрет pickle.loads() везде в DAG файлах
  - id: airflow-pickle-anywhere
    message: "КРИТИЧНО: Использование pickle.loads() запрещено в DAG файлах. Это может привести к RCE при десериализации недоверенных данных."
    languages:
      - python
    severity: ERROR
    patterns:
      - pattern: pickle.loads(...)
    metadata:
      category: security
      cwe: "CWE-502: Deserialization of Untrusted Data"
      owasp: "A08:2021 – Software and Data Integrity Failures"

  # УСИЛЕННОЕ ПРАВИЛО: Запрет marshal.loads() везде в DAG файлах
  - id: airflow-marshal-anywhere
    message: "КРИТИЧНО: Использование marshal.loads() запрещено в DAG файлах. Это может привести к RCE при десериализации недоверенных данных."
    languages:
      - python
    severity: ERROR
    patterns:
      - pattern: marshal.loads(...)
    metadata:
      category: security
      cwe: "CWE-502: Deserialization of Untrusted Data"
      owasp: "A08:2021 – Software and Data Integrity Failures"

  # УСИЛЕННОЕ ПРАВИЛО: subprocess с данными из конфига даже без shell=True
  - id: airflow-subprocess-from-conf
    message: "ОПАСНО: subprocess использует данные из dag_run.conf/params/xcom. Это может привести к Command Injection даже без shell=True."
    languages:
      - python
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern-inside: |
              $CMD = context['dag_run'].conf.get(...)
              ...
              subprocess.$METHOD($CMD, ...)
          - pattern-inside: |
              $CMD = context['params'].get(...)
              ...
              subprocess.$METHOD($CMD, ...)
          - pattern: |
              subprocess.$METHOD(context['dag_run'].conf[...], ...)
          - pattern: |
              subprocess.$METHOD(context['params'][...], ...)
          - pattern: |
              subprocess.$METHOD(ti.xcom_pull(...), ...)
      - metavariable-regex:
          metavariable: $METHOD
          regex: (Popen|call|run|check_call|check_output)
    metadata:
      category: security
      cwe: "CWE-78: OS Command Injection"
      owasp: "A03:2021 – Injection"

