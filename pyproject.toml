[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-fuzzing-scanner"
version = "0.1.0"
description = "LLM Fuzzing Scanner -- offline security testing tool for LLM models"
requires-python = ">=3.11"
dependencies = [
    "pyrit",
    "sqlalchemy>=2.0",
    "typer>=0.9",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "rich>=13.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
scanner = "scanner.cli:app"

[tool.setuptools.packages.find]
include = ["scanner*"]
