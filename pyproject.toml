[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-fuzzer"
version = "0.1.0"
description = "Universal LLM Security Fuzzing Service with Garak and PyRIT backends"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "LLM Security Team"}
]
keywords = ["llm", "security", "fuzzing", "red-teaming", "garak", "pyrit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pyrit>=0.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
llm-fuzzer = "llm_fuzzer.cli:app"

[project.urls]
Homepage = "https://github.com/your-org/llm-fuzzer"
Documentation = "https://github.com/your-org/llm-fuzzer#readme"
Repository = "https://github.com/your-org/llm-fuzzer"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm_fuzzer = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
